<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึก KPAC นักเรียน (เวอร์ชัน Supabase)</title>
    <!-- 1. ดึงไลบรารีสากลอย่างเป็นทางการของ Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // =========================================================================
        // 🔐 ส่วนตั้งค่ากุญแจเชื่อมต่อฐานข้อมูลออนไลน์ (มองเห็นและแก้ไขได้ง่ายที่สุดตรงนี้ครับ)
        // =========================================================================
        const SUPABASE_URL = 'https://kpgxprciwtlfqtwuyqhp.supabase.co';
        const SUPABASE_KEY = 'ให้เอากุญแจ sb_publishable_ ตัวบนสุดของคุณมาวางแทนข้อความนี้ทั้งหมดครับ';

        // เปิดประตูเชื่อมต่อระบบคลาวด์ความเร็วสูง
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <style>
        /* CSS ดีไซน์ดั้งเดิมทั้งหมดของระบบ KPAC */
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .kpac-container { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .header-title { color: #1e3a8a; text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .sub-title { text-align: center; color: #64748b; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 20px 0; }
        .btn-primary { background-color: #1e3a8a; color: #ffffff; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; transition: all 0.2s; }
        .btn-primary:hover { background-color: #1d4ed8; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="kpac-container">
    <h1 class="header-title">📊 ระบบบันทึก KPAC นักเรียน</h1>
    <p class="sub-title">ระบบบริหารจัดการสถานศึกษาและจัดสอบออนไลน์ ขับเคลื่อนด้วยโครงสร้างคลาวด์สากล</p>
    <hr>
    
    <!-- ส่วนเชื่อมต่อโครงสร้างระบบและ Layout การเรนเดอร์ปุ่มกดเดิมทั้งหมด 20,000 บรรทัดของคุณ -->
    <div id="kpac-app-core">
        <h3 style="color: #059669; text-align: center;">⚡ ระบบฐานข้อมูลคลาวด์เปิดทำงานออนไลน์เรียบร้อย (No-Lock Pipeline Active)</h3>
        <p style="text-align: center; color: #64748b;">ขณะนี้ระบบกำลังสแตนด์บายรับสิทธิ์เชื่อมต่อการลงทะเบียนเรียน บันทึกเวลาเรียน และกระดาษคำตอบของนักเรียนรายห้องเรียน</p>
    </div>
</div>

<script>
    /**
     * =========================================================================
     * 🗄️ ฟังก์ชันแกนหลักจัดการหลังบ้าน (Backend Operations) - แปลงลอจิกจาก Code.gs ดั้งเดิม
     * =========================================================================
     */

    // 🎯 1. ฟังก์ชันดึงข้อมูลรวม (ทดแทน doGet -> action: 'list' เดิม)
    async function getAllRecords() {
        try {
            const [subjects, students, scores, questions, subs, attendance, homeworks, systems] = await Promise.all([
                supabase.from('class_subjects').select('*'),
                supabase.from('student_records').select('*'),
                supabase.from('student_scores').select('*'),
                supabase.from('exam_questions').select('*'),
                supabase.from('exam_submissions').select('*'),
                supabase.from('attendance_logs').select('*'),
                supabase.from('homework_records').select('*'),
                supabase.from('system_and_evaluations').select('*')
            ]);

            const combinedData = [
                ...(subjects.data || []), ...(students.data || []), ...(scores.data || []),
                ...(questions.data || []), ...(subs.data || []), ...(attendance.data || []),
                ...(homeworks.data || []), ...(systems.data || [])
            ];

            return combinedData.map(item => ({ __backendId: item.id, ...item }));
        } catch (err) {
            console.error('⛔ สืบค้นข้อมูลล้มเหลว:', err.message);
            return [];
        }
    }

    // ➕ 2. ฟังก์ชันสร้างข้อมูลใหม่ (ทดแทน doPost -> action: 'create' เดิม)
    async function createRecord(record) {
        const tableMap = {
            'class_subject': 'class_subjects',
            'student': 'student_records', 'student_registration': 'student_records', 'kpac_request': 'student_records', 'registration_request': 'student_records',
            'grade': 'student_scores', 'class_subject_scores': 'student_scores',
            'exam_question': 'exam_questions',
            'exam_set': 'exam_submissions', 'exam_submission': 'exam_submissions',
            'attendance_part1': 'attendance_logs', 'attendance_part2': 'attendance_logs',
            'homework': 'homework_records',
            'admin': 'system_and_evaluations', 'settings': 'system_and_evaluations'
        };

        const targetTable = tableMap[record.type] || 'system_and_evaluations';
        const newId = record.__backendId || 'id_' + new Date().getTime() + '_' + Math.floor(Math.random() * 1000000);
        const payload = { id: newId, ...record };
        delete payload.__backendId;

        const { error } = await supabase.from(targetTable).insert([payload]);
        if (error) throw new Error('บันทึกคลาวด์ล้มเหลว: ' + error.message);
        return { __backendId: newId, ...record };
    }

    // 🔄 3. ฟังก์ชันแก้ไขและบันทึกคะแนนสอบ/คำตอบ (ทดแทน doPost -> action: 'update' เดิม)
    async function updateRecord(record) {
        const id = record.__backendId;
        if (!id) throw new Error('ไม่พบรหัสอ้างอิง __backendId');

        const tableMap = {
            'class_subject': 'class_subjects',
            'student': 'student_records', 'student_registration': 'student_records', 'kpac_request': 'student_records', 'registration_request': 'student_records',
            'grade': 'student_scores', 'class_subject_scores': 'student_scores',
            'exam_question': 'exam_questions',
            'exam_set': 'exam_submissions', 'exam_submission': 'exam_submissions',
            'attendance_part1': 'attendance_logs', 'attendance_part2': 'attendance_logs',
            'homework': 'homework_records',
            'admin': 'system_and_evaluations', 'settings': 'system_and_evaluations'
        };

        const targetTable = tableMap[record.type] || 'system_and_evaluations';
        const payload = { ...record, updated_at: new Date().toISOString() };
        delete payload.__backendId;

        const { error } = await supabase.from(targetTable).update(payload).eq('id', id);
        if (error) throw new Error('อัปเดตข้อมูลออนไลน์ล้มเหลว: ' + error.message);
        return record;
    }

    // 🗑️ 4. ฟังก์ชันลบข้อมูลออกจากระบบ (ทดแทน doPost -> action: 'delete' เดิม)
    async function deleteRecord(record) {
        const id = record.__backendId;
        if (!id) return;

        const tableMap = {
            'class_subject': 'class_subjects',
            'student': 'student_records', 'student_registration': 'student_records',
            'grade': 'student_scores', 'class_subject_scores': 'student_scores',
            'exam_question': 'exam_questions', 'exam_set': 'exam_submissions', 'exam_submission': 'exam_submissions',
            'homework': 'homework_records'
        };

        const targetTable = tableMap[record.type] || 'system_and_evaluations';
        await supabase.from(targetTable).delete().eq('id', id);
    }

    // เริ่มต้นระบบสืบค้นค่าเมื่อเปิดหน้าต่างขึ้นมา
    window.onload = function() {
        getAllRecords();
    };
</script>

<!-- ส่วนดีไซน์ปุ่มกดและลอจิกหน้าจออื่นๆ อีก 20,000 บรรทัดจะเรียงต่อตรงนี้เหมือนดั้งเดิมร้อยเปอร์เซ็นต์ครับ -->
</body>
</html>
