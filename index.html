<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบการเชื่อมต่อฐานข้อมูล KPAC</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding: 16px; color: #1e293b; }
  .box { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #64748b; font-size: 13px; margin: 0 0 14px; }
  button { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button.copy { background: #475569; margin-left: 8px; }
  .row { display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; align-items: flex-start; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .bad { background: #fef2f2; border: 1px solid #fecaca; }
  .warn { background: #fffbeb; border: 1px solid #fde68a; }
  .name { font-weight: 700; min-width: 190px; }
  .msg { white-space: pre-wrap; word-break: break-word; flex: 1; }
  .hint { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 12px; margin-top: 14px; font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
  <h1>🔌 ทดสอบการเชื่อมต่อฐานข้อมูล KPAC</h1>
  <p class="sub">หน้านี้ไม่เกี่ยวกับระบบหลัก ใช้ทดสอบว่าเว็บคุยกับฐานข้อมูลได้หรือไม่ และติดตรงไหน</p>
  <button onclick="runTest()">▶️ เริ่มทดสอบ</button>
  <button class="copy" onclick="copyResult()">📋 คัดลอกผลทั้งหมด</button>
  <div id="out" style="margin-top:14px"></div>
  <div class="hint" id="hint" style="display:none"></div>
</div>
<script>
const SUPABASE_URL = 'https://kpgxprciwtlfqtwuyqhp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bYfQMR-PzpwsOYqvTLW2jQ_q2Ny2zLo';
const TABLES = ['students', 'registrations', 'class_subjects', 'grades', 'exam_sets', 'exam_submissions', 'settings'];
const out = () => document.getElementById('out');
let lines = [];

function add(cls, name, msg) {
  lines.push(`${name}: ${msg}`);
  const d = document.createElement('div');
  d.className = 'row ' + cls;
  d.innerHTML = `<div class="name">${name}</div><div class="msg">${String(msg).replace(/</g, '&lt;')}</div>`;
  out().appendChild(d);
}

async function ping(path) {
  const t0 = Date.now();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Accept: 'application/json' }
  });
  const text = await res.text();
  return { ok: res.ok, status: res.status, ms: Date.now() - t0, text };
}

async function runTest() {
  out().innerHTML = ''; lines = []; document.getElementById('hint').style.display = 'none';
  add('', '🕐 เวลาเครื่องนี้', new Date().toString());
  add('', '🌐 ที่อยู่ฐานข้อมูล', SUPABASE_URL);

  // 1) อินเทอร์เน็ตออกได้ไหม
  try {
    await fetch('https://www.google.com/generate_204', { mode: 'no-cors', cache: 'no-store' });
    add('ok', '① อินเทอร์เน็ต', 'ออกเน็ตได้');
  } catch (e) { add('bad', '① อินเทอร์เน็ต', 'ออกเน็ตไม่ได้: ' + e.message); }

  // 2) เซิร์ฟเวอร์ตอบไหม
  let serverUp = false;
  try {
    const r = await ping('');
    serverUp = true;
    add(r.status < 500 ? 'ok' : 'bad', '② เซิร์ฟเวอร์ตอบ', `สถานะ ${r.status} · ใช้เวลา ${r.ms} มิลลิวินาที`);
  } catch (e) {
    add('bad', '② เซิร์ฟเวอร์ตอบ', 'ติดต่อไม่ได้เลย: ' + e.message + '\n(อาจเป็นเพราะโปรเจกต์ถูกหยุด หรือที่อยู่ฐานข้อมูลเปลี่ยน)');
  }

  // 3) กุญแจใช้ได้ไหม + ตารางอ่านได้ไหม
  if (serverUp) {
    for (const t of TABLES) {
      try {
        const r = await ping(`${t}?select=id&limit=1`);
        if (r.ok) add('ok', '③ ตาราง ' + t, `อ่านได้ (${r.ms} มิลลิวินาที)`);
        else add('bad', '③ ตาราง ' + t, `ล้มเหลว สถานะ ${r.status}\n${r.text.slice(0, 300)}`);
      } catch (e) { add('bad', '③ ตาราง ' + t, 'ล้มเหลว: ' + e.message); }
    }
    // 4) นับจำนวนแถวจริง
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/students?select=id`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Prefer: 'count=exact', Range: '0-0' }
      });
      add(res.ok ? 'ok' : 'bad', '④ จำนวนนักเรียนในฐานข้อมูล', (res.headers.get('content-range') || 'อ่านไม่ได้') + ' (ตัวเลขหลัง / คือจำนวนแถวทั้งหมด)');
    } catch (e) { add('bad', '④ จำนวนนักเรียน', e.message); }
  }

  // สรุปสาเหตุที่เป็นไปได้
  const text = lines.join('\n');
  let hint = '';
  if (/ล้มเหลว: |ติดต่อไม่ได้เลย/.test(text)) hint = '🔴 ติดต่อฐานข้อมูลไม่ได้เลย — มักเกิดจากโปรเจกต์ Supabase ถูกหยุดชั่วคราว (โปรเจกต์ฟรีจะถูกหยุดเมื่อไม่มีการใช้งานหลายวัน) ให้เข้า supabase.com → เลือกโปรเจกต์ → ถ้ามีปุ่ม Restore/Resume ให้กด แล้วรอสักครู่';
  else if (/สถานะ 401|Invalid API key|JWT/.test(text)) hint = '🔴 กุญแจเข้าถึงไม่ถูกต้องหรือถูกเปลี่ยน — เข้า Supabase → Project Settings → API แล้วคัดลอกคีย์ anon/publishable ตัวใหม่มาให้ผม จะได้ใส่ให้ในไฟล์ระบบ';
  else if (/สถานะ 403|permission denied|RLS/.test(text)) hint = '🔴 สิทธิ์การอ่านถูกปิด (RLS) — ต้องเปิดนโยบายให้อ่านได้ ส่งผลนี้มาให้ผม จะทำไฟล์ SQL แก้ให้';
  else if (/สถานะ 404|does not exist/.test(text)) hint = '🟡 บางตารางหาย — ส่งผลนี้มาให้ผม จะทำไฟล์ SQL สร้างคืนให้';
  else if (/อ่านได้/.test(text)) hint = '🟢 ฐานข้อมูลอ่านได้ปกติ แปลว่าปัญหาอยู่ที่ฝั่งหน้าเว็บ ไม่ใช่ฐานข้อมูล — ส่งผลนี้มาให้ผม พร้อมข้อความสีแดงใน Console ของหน้าระบบหลัก';
  const h = document.getElementById('hint');
  h.textContent = hint; h.style.display = 'block';
  lines.push('สรุป: ' + hint);
}

function copyResult() {
  const t = lines.join('\n');
  navigator.clipboard?.writeText(t).then(() => alert('คัดลอกแล้ว วางส่งมาได้เลย')).catch(() => {
    prompt('คัดลอกข้อความนี้แล้วส่งมา:', t);
  });
}
runTest();
</script>
</body>
</html>
